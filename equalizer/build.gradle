plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eqlab.equalizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eqlab.equalizer'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
