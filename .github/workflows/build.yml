name: Build APK

on:
  push:
    branches: [main]
    # 윈도우 앱이나 문서만 바뀐 푸시는 안드로이드 빌드 번호(build-N)를 소모하지 않는다.
    paths-ignore:
      - 'windows/**'
      - 'docs/**'
      - '.github/workflows/windows.yml'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle :app:assembleDebug :equalizer:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/eq-lab-test.apk
          cp equalizer/build/outputs/apk/debug/equalizer-debug.apk out/equalizer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            out/equalizer.apk out/eq-lab-test.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "equalizer.apk = real app, eq-lab-test.apk = diagnostic test app. Built from ${{ github.sha }}"
